# One-time job (2026-11-19): lets GitHub Actions publish both ChatDesq packages to npm without a stored token
# (npm trusted publishing over OIDC). Run it once from the Actions tab, then delete this file and the NPM_TOKEN secrets.
name: One-time - set up npm trusted publishing

on: workflow_dispatch

permissions:
  contents: read

jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: Trust this repo's publish.yml (and the n8n node repo's) for npm publishing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm whoami
          npm trust github @chatdesq/mcp-server --repo chatdesq/mcp-server --file publish.yml --allow-publish -y
          npm trust github n8n-nodes-chatdesq --repo chatdesq/n8n-nodes-chatdesq --file publish.yml --allow-publish -y
          npm trust list @chatdesq/mcp-server
          npm trust list n8n-nodes-chatdesq
